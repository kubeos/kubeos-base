// KubeOS: run the unattended upgrade machinery daily.
//
// WHY: a node is an appliance - nobody logs into it to run `apt upgrade`. Without these lines
// the apt-daily timers refresh the index and stop there, so Debian security fixes pile up
// (measured 2026-11-20: 17 upgradable packages on a freshly installed node) until an operator
// happens to run apt. 21- sorts after 20auto-upgrades (the package's own file), so these values
// win.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
