// KubeOS: apply SECURITY updates automatically, and nothing else.
//
// WHY THE #clear LINE: Debian's default (50unattended-upgrades) allows three origins, and the
// first is "origin=Debian,codename=${distro_codename},label=Debian" - that is the WHOLE trixie
// suite, so the stock policy would upgrade every package on the node on its own. Measured
// 2026-11-20: apt's own grammar rejects "#clear;" inside a list ("clear directive requires an
// option tree as argument"); the form below is the one apt accepts, and after it `apt-config
// dump` shows exactly one origin.
#clear Unattended-Upgrade::Origins-Pattern;
// The suite is written out as trixie deliberately. ${distro_codename} expands from
// /etc/os-release, and KubeOS calls itself "orhan" there (VERSION_CODENAME=orhan), so the
// obvious ${distro_codename}-security produced "orhan-security" - a suite that does not exist,
// matched nothing, and would have made this whole policy a silent no-op. Measured 2026-11-20
// with `unattended-upgrade --dry-run -v` on a live node: "Allowed origins are:
// origin=Debian,codename=orhan-security,label=Debian-Security" and "No packages found".
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=trixie-security,label=Debian-Security";
};

// Nothing KubeOS or the Kubernetes stack may move itself: these versions are vetted and mirrored
// deliberately (kubeos-kubernetes pins kubelet/kubeadm/kubectl with Depends: =, and the vendor
// feed is not configured on a node on purpose). Anchored, so the patterns cannot swallow an
// unrelated package name.
Unattended-Upgrade::Package-Blacklist {
    "^kubeos-";
    "^kubelet$";
    "^kubeadm$";
    "^kubectl$";
    "^kubernetes-cni$";
    "^cri-tools$";
    "^containerd\\.io$";
    "^docker-";
    "^helm$";
};

// A patched kernel only takes effect after a reboot, and a cluster node must not reboot itself:
// the operator decides when. Likewise nothing is ever removed automatically - deleting packages
// behind someone's back is how appliances break.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
