# KubeOS: what smartd watches, and where the alarm goes.
#
# WHY ITS OWN FILE: /etc/smartd.conf belongs to the smartmontools package, so shipping a copy
# of it from kubeos-base would make dpkg fail with "trying to overwrite /etc/smartd.conf,
# which is also in package smartmontools". /etc/systemd/system/smartd.service.d/10-kubeos.conf
# points smartd at this file instead, which also survives a smartmontools upgrade.
#
# WHY JOURNAL AND NOT MAIL: Debian's default line ends with "-m root -M exec
# /usr/share/smartmontools/smartd-runner", i.e. it tries to mail root - and a KubeOS node has
# no MTA, so the alert would be lost silently. "-M exec /bin/true" switches the mail path off;
# smartd still writes to syslog, which is the journal, so `journalctl -u smartd` and any log
# collection the operator has will carry it.
#
# WHAT IS WATCHED: DEVICESCAN is every disk the kernel reports.
#   -H  report a drive that fails its own health self-assessment
#   -f  report attributes that have failed
#   -t  report attributes that CHANGED (the early warning before -f)
#   -n standby,q  do not wake a disk that is asleep just to ask; "q" keeps the log quiet
DEVICESCAN -H -f -t -n standby,q -m root -M exec /bin/true
