# KubeOS: run smartd with our own configuration file.
#
# WHY: /etc/smartd.conf is owned by the smartmontools package (shipping our own copy would be a
# dpkg conffile conflict), and Debian's default there mails root - which cannot work on a node
# with no MTA. Clearing ExecStart first is required: a drop-in may only REPLACE the command line
# if the original assignment is reset.
#
# WHY smartmontools.service AND NOT smartd.service: smartd.service is only an ALIAS for
# smartmontools.service (a symlink to another symlink), and a .wants link pointing at an alias
# made lintian fail the package with "service-file-is-not-a-file". The canonical name is used
# here and in the .wants link; the `smartd` name still works for the operator.
[Service]
ExecStart=
ExecStart=/usr/sbin/smartd -n -c /etc/kubeos/smartd.conf
