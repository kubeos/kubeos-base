# KubeOS: bound what crash dumps may take, so a diagnostic can never take a node down.
#
# WHY  systemd's defaults are ExternalSizeMax=32G (a single dump) and MaxUse= (no total
#      limit at all), while a KubeOS node's root filesystem is about 10 GB. A crash-looping
#      300 MB process would write a 300 MB core per crash into /var/lib/systemd/coredump
#      until / filled - and a full / stops kubelet, etcd and the dashboard. That is an
#      outage caused by a feature nobody was even looking at (2026-11-20).
# WHAT MaxUse caps the whole store and systemd deletes the OLDEST dumps to stay under it,
#      KeepFree keeps a floor of free space on /, and ExternalSizeMax refuses a single dump
#      larger than 512 MB instead of eating the disk. The most recent crashes - the ones
#      someone actually debugs with `coredumpctl` - are exactly what survives.
[Coredump]
Storage=external
MaxUse=200M
KeepFree=1G
ExternalSizeMax=512M
