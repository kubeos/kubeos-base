# KubeOS: let the hardware reset a node that has wedged, instead of leaving it dead.
#
# WHY  With RuntimeWatchdogUSec=0 (the default) nothing pets the watchdog, so a hung kernel or
#      a starved PID 1 leaves the machine sitting there until a human notices and power-cycles
#      it. An appliance is expected to come back by itself (2026-11-20: /dev/watchdog exists on
#      the KVM test node, so this is exercised, not assumed).
# HOW  systemd opens /dev/watchdog and pets it from PID 1's event loop; if that loop stops
#      running for RuntimeWatchdogSec, the hardware kicks the machine. 30s is a fast recovery
#      and still far longer than any normal stall; a slow disk that takes longer than that to
#      make progress is a node that should have been reset anyway.
#      RebootWatchdogSec keeps petting during shutdown: a reboot that hangs half way (a stuck
#      unmount, a firmware hand-off that never returns) becomes a hard reset instead of a machine
#      that never comes back.
# SAFE Where no watchdog device exists the setting is simply not acted upon - systemd logs that
#      it found no watchdog and carries on, so this is harmless on hardware without one. Machines
#      that need it but have no hardware watchdog can load the kernel's softdog module.
# NOTE [Manager] settings are read by PID 1, so an upgrade takes effect at the next boot, or
#      immediately after `systemctl daemon-reexec`.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
